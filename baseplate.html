<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Baseplate</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #6ab0de; font-family: "Gill Sans", "Segoe UI", Verdana, sans-serif; }
  #game { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; top: 14px; left: 14px; z-index: 5;
    color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    font-size: 13px; line-height: 1.6; pointer-events: none;
    background: rgba(0,0,0,0.25); padding: 10px 14px; border-radius: 8px;
  }
  #hud b { color: #ffe46b; }
  #title { position: fixed; top: 14px; right: 16px; z-index: 5; color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4); font-size: 20px; letter-spacing: 1px; font-weight: 700; }
  #reset { position: fixed; bottom: 16px; right: 16px; z-index: 5;
    background: rgba(255,255,255,0.9); border: 0; border-radius: 8px; padding: 8px 16px;
    font-size: 14px; font-weight: 700; color: #333; cursor: pointer; }
  #reset:hover { background: #fff; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="title">BASEPLATE</div>
  <div id="hud">
    <b>WASD</b> move &nbsp;·&nbsp; <b>Space</b> jump<br/>
    <b>Drag</b> orbit camera &nbsp;·&nbsp; <b>Scroll</b> zoom &nbsp;·&nbsp; <b>Shift</b> run
  </div>
  <button id="reset">Reset position</button>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('game');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x86c5ec);
    scene.fog = new THREE.Fog(0x86c5ec, 180, 360);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

    // ---------- lighting (classic flat Roblox feel) ----------
    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    const sun = new THREE.DirectionalLight(0xfff4e0, 1.1);
    sun.position.set(60, 120, 40);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 300;
    const S = 90;
    sun.shadow.camera.left = -S; sun.shadow.camera.right = S;
    sun.shadow.camera.top = S; sun.shadow.camera.bottom = -S;
    sun.shadow.bias = -0.0004;
    scene.add(sun);
    // keep the shadow frustum following the player
    scene.add(sun.target);

    // ---------- baseplate with stud texture ----------
    const BASE_SIZE = 256;
    function makeStudTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#9d9c9f';
      ctx.fillRect(0, 0, 128, 128);
      // cell separation lines
      ctx.strokeStyle = 'rgba(0,0,0,0.06)';
      ctx.lineWidth = 2;
      ctx.strokeRect(1, 1, 126, 126);
      // raised stud
      const cx = 64, cy = 64, r = 38;
      const g = ctx.createRadialGradient(cx - 12, cy - 12, 4, cx, cy, r);
      g.addColorStop(0, '#bdbcbf');
      g.addColorStop(0.7, '#a6a5a8');
      g.addColorStop(1, '#8f8e91');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(BASE_SIZE / 4, BASE_SIZE / 4); // one stud every 4 units
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    const baseTop = new THREE.Mesh(
      new THREE.BoxGeometry(BASE_SIZE, 2, BASE_SIZE),
      [
        new THREE.MeshStandardMaterial({ color: 0x8f8e91, roughness: 1 }),
        new THREE.MeshStandardMaterial({ color: 0x8f8e91, roughness: 1 }),
        new THREE.MeshStandardMaterial({ map: makeStudTexture(), roughness: 0.95 }),
        new THREE.MeshStandardMaterial({ color: 0x6f6e71, roughness: 1 }),
        new THREE.MeshStandardMaterial({ color: 0x8f8e91, roughness: 1 }),
        new THREE.MeshStandardMaterial({ color: 0x8f8e91, roughness: 1 }),
      ]
    );
    baseTop.position.y = -1;
    baseTop.receiveShadow = true;
    scene.add(baseTop);

    // ---------- spawn location pad ----------
    const spawn = new THREE.Group();
    const padBase = new THREE.Mesh(
      new THREE.BoxGeometry(8, 1, 8),
      new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.9 })
    );
    padBase.position.y = 0.5;
    padBase.castShadow = true; padBase.receiveShadow = true;
    spawn.add(padBase);
    const padTop = new THREE.Mesh(
      new THREE.BoxGeometry(7, 0.2, 7),
      new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.85 })
    );
    padTop.position.y = 1.05;
    padTop.receiveShadow = true;
    spawn.add(padTop);
    // little forward arrow
    const arrow = new THREE.Mesh(
      new THREE.ConeGeometry(1.2, 2.4, 4),
      new THREE.MeshStandardMaterial({ color: 0x4c8bf5, roughness: 0.7 })
    );
    arrow.rotation.x = Math.PI / 2;
    arrow.rotation.y = Math.PI / 4;
    arrow.position.set(0, 1.2, -1.5);
    spawn.add(arrow);
    scene.add(spawn);

    // a few decorative bricks scattered around (the classic studio props)
    const brickColors = [0xc4281c, 0xf5cd30, 0x0a6ce7, 0x4caf50, 0xe8912f];
    for (let i = 0; i < 7; i++) {
      const w = 4 + Math.random() * 6, h = 2 + Math.random() * 4, d = 4 + Math.random() * 6;
      const b = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color: brickColors[i % brickColors.length], roughness: 0.8 })
      );
      const ang = Math.random() * Math.PI * 2;
      const dist = 24 + Math.random() * 70;
      b.position.set(Math.cos(ang) * dist, h / 2, Math.sin(ang) * dist);
      b.rotation.y = Math.random() * Math.PI;
      b.castShadow = true; b.receiveShadow = true;
      scene.add(b);
    }

    // ---------- character ("Noob") ----------
    // Built so the group origin is at the feet (y = 0 = ground).
    const NOOB = {
      head: 0xf3c000,   // bright yellow
      arm:  0xf3c000,   // bright yellow
      torso:0x0a6ce7,   // bright blue
      legs: 0x4caf50,   // bright green
    };
    function partMat(color) { return new THREE.MeshStandardMaterial({ color, roughness: 0.75 }); }

    function makeFaceTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#f3c000';
      ctx.fillRect(0, 0, 128, 128);
      ctx.fillStyle = '#1a1a1a';
      // eyes
      ctx.beginPath(); ctx.ellipse(44, 52, 8, 13, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(84, 52, 8, 13, 0, 0, Math.PI * 2); ctx.fill();
      // smile
      ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.strokeStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(64, 70, 22, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const character = new THREE.Group();

    // torso: y 2..4
    const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), partMat(NOOB.torso));
    torso.position.y = 3;
    torso.castShadow = true; torso.receiveShadow = true;
    character.add(torso);

    // head: cube on top, face on +Z
    const headFace = new THREE.MeshStandardMaterial({ map: makeFaceTexture(), roughness: 0.6 });
    const headPlain = partMat(NOOB.head);
    const head = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 1.5, 1.5),
      [headPlain, headPlain, headPlain, headPlain, headFace, headPlain]
    );
    head.position.y = 4 + 0.75;
    head.castShadow = true;
    character.add(head);

    // limb pivot helper: pivot at the top, mesh hangs below
    function makeLimb(color, x, pivotY) {
      const pivot = new THREE.Group();
      pivot.position.set(x, pivotY, 0);
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), partMat(color));
      mesh.position.y = -1;
      mesh.castShadow = true; mesh.receiveShadow = true;
      pivot.add(mesh);
      character.add(pivot);
      return pivot;
    }
    const leftArm  = makeLimb(NOOB.arm, 1.5, 4);
    const rightArm = makeLimb(NOOB.arm, -1.5, 4);
    const leftLeg  = makeLimb(NOOB.legs, 0.5, 2);
    const rightLeg = makeLimb(NOOB.legs, -0.5, 2);

    scene.add(character);

    const SPAWN_POS = new THREE.Vector3(0, 0, 8);
    character.position.copy(SPAWN_POS);

    // ---------- third-person orbit camera ----------
    const cam = { yaw: Math.PI, pitch: 0.45, dist: 22 };
    let dragging = false, lastX = 0, lastY = 0;

    canvas.addEventListener('mousedown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
    addEventListener('mouseup', () => { dragging = false; });
    addEventListener('mousemove', (e) => {
      if (!dragging) return;
      cam.yaw   -= (e.clientX - lastX) * 0.005;
      cam.pitch -= (e.clientY - lastY) * 0.005;
      cam.pitch = Math.max(0.05, Math.min(1.4, cam.pitch));
      lastX = e.clientX; lastY = e.clientY;
    });
    canvas.addEventListener('wheel', (e) => {
      cam.dist = Math.max(8, Math.min(60, cam.dist + Math.sign(e.deltaY) * 2));
      e.preventDefault();
    }, { passive: false });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // touch support (one finger orbit)
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length) { dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
    }, { passive: true });
    canvas.addEventListener('touchmove', (e) => {
      if (!dragging || !e.touches.length) return;
      cam.yaw   -= (e.touches[0].clientX - lastX) * 0.008;
      cam.pitch -= (e.touches[0].clientY - lastY) * 0.008;
      cam.pitch = Math.max(0.05, Math.min(1.4, cam.pitch));
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    }, { passive: true });
    addEventListener('touchend', () => { dragging = false; });

    // ---------- input ----------
    const keys = {};
    addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    });
    addEventListener('keyup', (e) => { keys[e.code] = false; });

    document.getElementById('reset').addEventListener('click', () => {
      character.position.copy(SPAWN_POS);
      vy = 0; grounded = true;
    });

    // ---------- physics / movement ----------
    let vy = 0;
    let grounded = true;
    const GRAVITY = 70;
    const JUMP = 26;
    let walkPhase = 0;
    let facing = character.rotation.y; // smoothed yaw

    const clock = new THREE.Clock();
    const tmpFwd = new THREE.Vector3();

    function animate() {
      const dt = Math.min(clock.getDelta(), 0.05);
      requestAnimationFrame(animate);

      // movement direction relative to camera yaw
      let ix = 0, iz = 0;
      if (keys['KeyW'] || keys['ArrowUp'])    iz += 1;
      if (keys['KeyS'] || keys['ArrowDown'])  iz -= 1;
      if (keys['KeyA'] || keys['ArrowLeft'])  ix += 1;
      if (keys['KeyD'] || keys['ArrowRight']) ix -= 1;

      const moving = (ix !== 0 || iz !== 0);
      const run = keys['ShiftLeft'] || keys['ShiftRight'];
      const speed = run ? 28 : 16;

      if (moving) {
        // camera forward (toward where camera looks, on XZ)
        const camFwdX = -Math.sin(cam.yaw);
        const camFwdZ = -Math.cos(cam.yaw);
        const camRightX = Math.sin(cam.yaw - Math.PI / 2);
        const camRightZ = Math.cos(cam.yaw - Math.PI / 2);
        let mx = camFwdX * iz + camRightX * ix;
        let mz = camFwdZ * iz + camRightZ * ix;
        const len = Math.hypot(mx, mz) || 1;
        mx /= len; mz /= len;

        character.position.x += mx * speed * dt;
        character.position.z += mz * speed * dt;

        // face movement direction (face is on +Z, so atan2 of the move vector)
        const targetFacing = Math.atan2(mx, mz);
        // shortest-arc lerp
        let diff = targetFacing - facing;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        facing += diff * Math.min(1, dt * 14);
        character.rotation.y = facing;

        // keep on the baseplate
        const lim = BASE_SIZE / 2 - 2;
        character.position.x = Math.max(-lim, Math.min(lim, character.position.x));
        character.position.z = Math.max(-lim, Math.min(lim, character.position.z));
      }

      // jump + gravity
      if (keys['Space'] && grounded) { vy = JUMP; grounded = false; }
      vy -= GRAVITY * dt;
      character.position.y += vy * dt;
      if (character.position.y <= 0) { character.position.y = 0; vy = 0; grounded = true; }

      // limb animation
      if (!grounded) {
        // tuck pose in the air
        leftArm.rotation.x  = -0.5; rightArm.rotation.x = -0.5;
        leftLeg.rotation.x  = 0.3;  rightLeg.rotation.x = -0.3;
      } else if (moving) {
        walkPhase += dt * (run ? 16 : 11);
        const sw = Math.sin(walkPhase) * 0.9;
        leftLeg.rotation.x  =  sw;  rightLeg.rotation.x = -sw;
        leftArm.rotation.x  = -sw;  rightArm.rotation.x =  sw;
      } else {
        // ease back to rest
        for (const p of [leftArm, rightArm, leftLeg, rightLeg]) p.rotation.x *= 0.8;
      }

      // ---------- camera follow ----------
      const target = new THREE.Vector3(
        character.position.x,
        character.position.y + 4,
        character.position.z
      );
      const cp = camera.position;
      cp.x = target.x + Math.sin(cam.yaw) * Math.cos(cam.pitch) * cam.dist;
      cp.y = target.y + Math.sin(cam.pitch) * cam.dist;
      cp.z = target.z + Math.cos(cam.yaw) * Math.cos(cam.pitch) * cam.dist;
      if (cp.y < 1) cp.y = 1;
      camera.lookAt(target);

      // move the sun + shadow box with the player
      sun.position.set(character.position.x + 60, 120, character.position.z + 40);
      sun.target.position.copy(character.position);

      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
